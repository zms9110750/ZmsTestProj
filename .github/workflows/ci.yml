# CI workflow — 打包 + 发版
# 触发：PR（验证）/ push tag v*（发版）/ 网页按钮（发版）
# 发版产物：草稿 Release（需手动 Publish 才公开）
name: CI

on:
  pull_request:
    branches: [ "main", "master" ]
    types: [ "opened", "synchronize", "reopened", "closed" ]
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "发版版本号（如 1.2.3）。留空则用 Directory.Build.props 中的版本。"
        required: false
        type: string

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bver.outputs.version }}
      should_release: ${{ steps.relflag.outputs.should_release }}
      exe_json: ${{ steps.classify.outputs.exe_json }}
      lib_json: ${{ steps.classify.outputs.lib_json }}
      tfm_json: ${{ steps.classify.outputs.tfm_json }}
    steps:
      - name: Determine .NET version
        id: dotver
        shell: pwsh
        run: |
          $year = [System.DateTime]::UtcNow.Year
          $ver = "$($year - 2016).0.x"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.dotver.outputs.version }}
          dotnet-quality: ga

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release

      - name: Resolve build version
        id: bver
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $input = "${{ github.event.inputs.version }}".Trim()
          $ver = "0.0.0"
          if ($input -ne "") {
            # 网页按钮填了版本 → 用它（去掉 v 前缀，纯版本号）
            $ver = $input.TrimStart('v')
          } elseif ($env:EVENT_NAME -eq "workflow_dispatch") {
            # 网页按钮没填 → 从 Directory.Build.props 读版本
            $props = Get-Content Directory.Build.props -Raw
            if ($props -match '<Version>([^<]+)</Version>') { $ver = $Matches[1] }
          } elseif ($env:EVENT_NAME -eq "push") {
            # tag 触发 → ref_name 是 v1.2.3，去 v 前缀
            $ver = "${{ github.ref_name }}".TrimStart('v')
          }
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "build version: $ver"

      - name: Compute release flag
        id: relflag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          # 是否发版：tag push / 网页按钮 / PR 合并（里程碑）都发；普通 PR 验证不发
          $rel = "false"
          if ($env:EVENT_NAME -eq "push" -and $env:GITHUB_REF -like "refs/tags/v*") {
            $rel = "true"
          } elseif ($env:EVENT_NAME -eq "workflow_dispatch") {
            $rel = "true"
          } elseif ($env:EVENT_NAME -eq "pull_request" -and $env:PR_MERGED -eq "true") {
            $rel = "true"
          }
          "should_release=$rel" >> $env:GITHUB_OUTPUT
          Write-Host "should_release: $rel"

      - name: Classify projects
        id: classify
        shell: pwsh
        run: |
          function Parse-Framework($fw) {
            $fw = $fw.ToLower()
            if ($fw -match '^net(\d+)\.(\d+)') {
              return @{ Family = "net"; Major = [int]$Matches[1]; Minor = [int]$Matches[2] }
            }
            if ($fw -match '^netcoreapp(\d+)\.(\d+)') {
              return @{ Family = "net"; Major = [int]$Matches[1]; Minor = [int]$Matches[2] }
            }
            if ($fw -match '^net4(\d)(\d?)$') {
              $m = [int]$Matches[1]; $p = if ($Matches[2]) { [int]$Matches[2] } else { 0 }
              return @{ Family = "netfx"; Major = 4; Minor = $m; Patch = $p }
            }
            if ($fw -match '^netstandard(\d+)\.(\d+)$') {
              return @{ Family = "netstandard"; Major = [int]$Matches[1]; Minor = [int]$Matches[2] }
            }
            return @{ Family = "unknown"; Major = 0; Minor = 0 }
          }

          # 优先从 slnx 读项目列表（XML 可读、结构明确），找不到再递归扫 csproj
          $projFiles = @()
          $slnx = Get-ChildItem -Recurse -Filter "*.slnx" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($slnx) {
            [xml]$doc = Get-Content $slnx.FullName -Raw
            $projFiles = @($doc.SelectNodes('//Project') | ForEach-Object { Join-Path $slnx.DirectoryName $_.Path })
            Write-Host "从 slnx ($($slnx.Name)) 读取 $($projFiles.Count) 个项目"
          } else {
            $projFiles = @(Get-ChildItem -Recurse -Filter "*.csproj" | ForEach-Object { $_.FullName })
            Write-Host "未找到 slnx，递归扫描 $($projFiles.Count) 个 csproj"
          }

          $exes = @(); $libs = @(); $allTfms = New-Object System.Collections.Generic.List[string]
          foreach ($proj in $projFiles) {
            $content = Get-Content $proj -Raw
            $isTest = $content -match '(Microsoft\.NET\.Test\.Sdk|MSTest|NUnit|xunit\.v3\.mtp-v2|xunit|TestingPlatformDotnetTestSupport)'
            if ($isTest) { continue }

            $outType = if ($content -match '<OutputType>(.*?)</OutputType>') { $Matches[1] } else { "Library" }
            $asmName = if ($content -match '<AssemblyName>(.*?)</AssemblyName>') { $Matches[1] } else { [IO.Path]::GetFileNameWithoutExtension($proj) }
            $tfStr = if ($content -match '<TargetFrameworks>(.*?)</TargetFrameworks>') { $Matches[1] }
                     elseif ($content -match '<TargetFramework>(.*?)</TargetFramework>') { $Matches[1] }
                     else { "" }

            $frameworks = $tfStr.Split(';', [StringSplitOptions]::RemoveEmptyEntries)
            foreach ($fw in $frameworks) { if ($fw -and -not $allTfms.Contains($fw)) { $allTfms.Add($fw) } }

            $projName = [IO.Path]::GetFileNameWithoutExtension($proj)
            if ($outType -eq "Exe" -or $outType -eq "WinExe") {
              $exes += [PSCustomObject]@{
                Path = $proj; Name = $projName; AssemblyName = $asmName
                RawFrameworks = @($frameworks)
                Frameworks = $frameworks | ForEach-Object { Parse-Framework $_ }
              }
            } else {
              $libs += $proj
            }
          }

          $exeJson = $exes | ConvertTo-Json -Compress -Depth 3
          $libJson = $libs | ConvertTo-Json -Compress
          $tfmArr = $allTfms | Sort-Object | ForEach-Object { '"' + $_ + '"' }
          $tfmJson = "[" + ($tfmArr -join ',') + "]"

          $delim = "EOF_$([System.Guid]::NewGuid().ToString('N'))"
          "exe_json<<$delim" >> $env:GITHUB_OUTPUT; $exeJson >> $env:GITHUB_OUTPUT; $delim >> $env:GITHUB_OUTPUT
          "lib_json<<$delim" >> $env:GITHUB_OUTPUT; $libJson >> $env:GITHUB_OUTPUT; $delim >> $env:GITHUB_OUTPUT
          "tfm_json<<$delim" >> $env:GITHUB_OUTPUT; $tfmJson >> $env:GITHUB_OUTPUT; $delim >> $env:GITHUB_OUTPUT

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Determine .NET version
        id: dotver
        shell: pwsh
        run: |
          $year = [System.DateTime]::UtcNow.Year
          $ver = "$($year - 2016).0.x"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.dotver.outputs.version }}
          dotnet-quality: ga

      - run: dotnet restore
      - run: dotnet test -c Release --no-restore
        shell: pwsh

  publish-self-contained:
    if: needs.build.outputs.should_release == 'true'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Determine .NET version
        id: dotver
        shell: pwsh
        run: |
          $year = [System.DateTime]::UtcNow.Year
          $ver = "$($year - 2016).0.x"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.dotver.outputs.version }}
          dotnet-quality: ga

      - run: dotnet restore

      - name: Parse exe info and publish
        shell: pwsh
        env:
          EXE_JSON: ${{ needs.build.outputs.exe_json }}
        run: |
          function Get-Highest {
            param($frameworks)
            $valid = $frameworks | Where-Object { -not ($_.Family -eq "net" -and $_.Major -lt 3) }
            $valid | Sort-Object { @{net=3;netfx=2;netstandard=1}[$_.Family] }, `
              { $_.Major }, { $_.Minor } -Descending | Select-Object -First 1
          }
          $exes = $env:EXE_JSON | ConvertFrom-Json
          $rid = '${{ matrix.rid }}'

          foreach ($exe in $exes) {
            $best = Get-Highest $exe.Frameworks
            if (-not $best) { Write-Host "跳过 $($exe.Name): 无可构建框架"; continue }
            $fw = $exe.RawFrameworks | Where-Object { $_ -match "net$($best.Major)[.$]$($best.Minor)" } | Select-Object -First 1
            if (-not $fw) { $fw = $exe.RawFrameworks | Where-Object { $_ -match "net$($best.Major)[.$]" } | Select-Object -First 1 }
            if (-not $fw) { $fw = $exe.RawFrameworks[0] }

            $outDir = "publish/tmp/$($exe.Name)-$rid"
            try {
              dotnet publish $exe.Path -c Release -f $fw -r $rid --self-contained true -o $outDir
              if ($LASTEXITCODE -ne 0) { throw "exit $LASTEXITCODE" }
              Compress-Archive -Path "$outDir/*" -DestinationPath "publish/$($exe.Name)-$rid.zip" -Force
              Remove-Item $outDir -Recurse -Force -ErrorAction SilentlyContinue
            } catch { Write-Host "跳过 $($exe.Name)-$rid (不兼容)" }
          }
          $LASTEXITCODE = 0

      - uses: actions/upload-artifact@v4
        with:
          name: zips-sc-${{ matrix.rid }}
          path: publish/*.zip

  publish-fdd:
    if: needs.build.outputs.should_release == 'true'
    needs: build
    strategy:
      matrix:
        fw: ${{ fromJson(needs.build.outputs.tfm_json) }}
    runs-on: ubuntu-latest
    steps:
      - name: Determine .NET version
        id: dotver
        shell: pwsh
        run: |
          $year = [System.DateTime]::UtcNow.Year
          $ver = "$($year - 2016).0.x"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.dotver.outputs.version }}
          dotnet-quality: ga

      - run: dotnet restore

      - name: Publish FDD and zip
        shell: pwsh
        env:
          EXE_JSON: ${{ needs.build.outputs.exe_json }}
          TFM_JSON: ${{ needs.build.outputs.tfm_json }}
        run: |
          $exes = $env:EXE_JSON | ConvertFrom-Json
          $fw = '${{ matrix.fw }}'
          $matched = $exes | Where-Object { $_.RawFrameworks -contains $fw }
          if (-not $matched) { Write-Host "项目不支持 $fw"; exit 0 }
          $projNames = ($matched | ForEach-Object { $_.Name }) -join "+"
          $outDir = "publish/tmp/fdd-$projNames-$fw"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          foreach ($exe in $matched) {
            Write-Host "FDD $($exe.Name) -> $fw"
            dotnet publish $exe.Path -c Release -f $fw -o $outDir
            if ($LASTEXITCODE -ne 0) { throw "$($exe.Name)-$fw 发布失败" }
          }
          Compress-Archive -Path "$outDir/*" -DestinationPath "publish/$projNames-$fw.zip" -Force
          Remove-Item $outDir -Recurse -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: zips-fdd-${{ matrix.fw }}
          path: publish/*.zip

  pack:
    if: needs.build.outputs.should_release == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Determine .NET version
        id: dotver
        shell: pwsh
        run: |
          $year = [System.DateTime]::UtcNow.Year
          $ver = "$($year - 2016).0.x"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.dotver.outputs.version }}
          dotnet-quality: ga

      - run: dotnet restore

      - name: Pack libraries
        shell: pwsh
        env:
          LIB_JSON: ${{ needs.build.outputs.lib_json }}
          PACK_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $paths = $env:LIB_JSON | ConvertFrom-Json
          foreach ($p in $paths) {
            Write-Host "Packing: $(Split-Path $p -Leaf) v$env:PACK_VERSION"
            try {
              dotnet pack $p -c Release -o publish/nupkg -p:Version=$env:PACK_VERSION
              if ($LASTEXITCODE -ne 0) { throw "exit $LASTEXITCODE" }
            } catch { Write-Host "跳过 $(Split-Path $p -Leaf) (不兼容)" }
          }
          $LASTEXITCODE = 0

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: publish/nupkg/*

  release:
    if: needs.build.outputs.should_release == 'true'
    needs: [build, test, publish-self-contained, publish-fdd, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Show trigger info
        shell: pwsh
        run: |
          Write-Host "=== 触发信息 ==="
          Write-Host "event_name      : ${{ github.event_name }}"
          Write-Host "ref             : ${{ github.ref }}"
          Write-Host "ref_name        : ${{ github.ref_name }}"
          Write-Host "actor           : ${{ github.actor }}"
          Write-Host "sha             : ${{ github.sha }}"
          Write-Host "base_ref        : ${{ github.base_ref }}"
          Write-Host "head_ref        : ${{ github.head_ref }}"
          Write-Host "================="

      - name: Resolve release tag
        id: rtag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          MILESTONE: ${{ github.event.pull_request.milestone.title }}
        run: |
          if ($env:EVENT_NAME -eq "pull_request" -and $env:PR_MERGED -eq "true") {
            # PR 合并发版：里程碑 vX.Y.Z → vX.Y.Z-build.{max+1}
            $milestone = $env:MILESTONE.Trim()
            if ($milestone -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
              Write-Host "里程碑必须是 vX.Y.Z（如 v0.2.0），当前：'$milestone'，跳过发版"
              "skip=true" >> $env:GITHUB_OUTPUT
              exit 0
            }
            $ver = $milestone.TrimStart('v')
            $builds = @(git tag -l "v${ver}-build.*")
            $max = -1
            foreach ($b in $builds) {
              if ($b -match "^v${ver}-build\.(\d+)$") {
                $n = [int]$Matches[1]
                if ($n -gt $max) { $max = $n }
              }
            }
            $next = $max + 1
            $full = "$ver-build.$next"
            $tag = "v$full"
            Write-Host "里程碑 $milestone → $tag"
          } else {
            # tag push / dispatch：直接 v{版本}
            $ver = "${{ needs.build.outputs.version }}"
            $tag = "v$ver"
            Write-Host "release tag: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Skip if release exists
        id: skip
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rtag.outputs.tag }}
          RTAG_SKIP: ${{ steps.rtag.outputs.skip }}
        run: |
          if ($env:RTAG_SKIP -eq "true") {
            Write-Host "里程碑非法，跳过发版"
            "skipped=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          # 该 tag 已有任何 Release（草稿或已发布）→ 跳过。
          # 防死循环：发布草稿 → 触发 CI → 再次触发时发现已存在 → 不再建草稿/覆盖已发布的。
          gh release view "$env:TAG" --repo ${{ github.repository }} --json id 2>&1 | Out-Null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) {
            Write-Host "tag $env:TAG 已有 Release，跳过（防重复发版/覆盖）"
            "skipped=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "tag $env:TAG 无 Release，继续发版"
            "skipped=false" >> $env:GITHUB_OUTPUT
          }
          # gh 失败会残留 $LASTEXITCODE=1 → 显式成功退出，避免步骤被误判失败
          exit 0

      - uses: actions/download-artifact@v4
        if: steps.skip.outputs.skipped != 'true'

      - name: Collect all artifacts
        if: steps.skip.outputs.skipped != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path publish -Force | Out-Null
          Get-ChildItem -Recurse -Filter "*.zip" | Move-Item -Destination publish/ -Force
          Get-ChildItem -Recurse -Filter "*.nupkg" | Move-Item -Destination publish/ -Force

      - uses: softprops/action-gh-release@v2
        if: steps.skip.outputs.skipped != 'true'
        with:
          tag_name: ${{ steps.rtag.outputs.tag }}
          files: "publish/*"
          draft: true
          generate_release_notes: true

  # PR 预览：PR 打开/更新时打包，评论附下载链接
  pr-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Determine .NET version
        id: dotver
        shell: pwsh
        run: |
          $year = [System.DateTime]::UtcNow.Year
          $ver = "$($year - 2016).0.x"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.dotver.outputs.version }}
          dotnet-quality: ga

      - run: dotnet restore

      - name: Pack PR preview
        shell: pwsh
        env:
          LIB_JSON: ${{ needs.build.outputs.lib_json }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          $sha7 = "${{ github.event.pull_request.head.sha }}".Substring(0, 7)
          $ver = "0.0.0-pr.$env:PR_NUM.$sha7"
          New-Item -ItemType Directory -Path publish -Force | Out-Null
          $paths = $env:LIB_JSON | ConvertFrom-Json
          foreach ($p in $paths) {
            Write-Host "Packing: $(Split-Path $p -Leaf) v$ver"
            dotnet pack $p -c Release -o publish/nupkg -p:Version=$ver
            if ($LASTEXITCODE -ne 0) { throw "exit $LASTEXITCODE" }
          }
          "ver=$ver" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-pr-${{ github.event.pull_request.number }}
          path: publish/nupkg/*
          if-no-files-found: error

      - name: Comment PR with download link
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        uses: actions/github-script@v7
        with:
          script: |
            const { repo } = context;
            const pr = context.payload.pull_request.number;
            const sha7 = context.payload.pull_request.head.sha.slice(0, 7);

            // 查当前 run 的 artifact，生成可点击下载链接
            const runId = context.runId;
            const arts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: repo.owner, repo: repo.repo, run_id: runId,
            });
            const links = arts.data.artifacts.map(a =>
              `- [${a.name}](https://github.com/${repo.owner}/${repo.repo}/actions/runs/${runId}/artifacts/${a.id}) (${(a.size_in_bytes/1024).toFixed(1)} KB)`
            ).join('\n') || '（无 artifact）';

            const body = [
              `## 📦 PR 预览包已生成`,
              ``,
              `- 版本：\`0.0.0-pr.${pr}.${sha7}\``,
              `- 下载：`,
              links,
              ``,
              `> 需要重新打包？评论回复 \`@github-actions[bot] pack ${sha7}\``,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: repo.owner, repo: repo.repo, issue_number: pr, body,
            });
